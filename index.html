<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomie - オンラインチャット</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #f4f6f8; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
    }
    
    /* モーダル（ダイアログ）共通スタイル */
    .modal-overlay { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0, 0, 0, 0.4); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .card { 
      background: #fff; 
      padding: 24px; 
      border-radius: 16px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
      width: 90%; 
      max-width: 320px; 
      text-align: center; 
    }
    .card h3 { color: #333; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #666; margin-bottom: 16px; }
    .card input { 
      width: 100%; 
      padding: 10px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      font-size: 14px; 
      outline: none; 
      margin-bottom: 12px; 
    }
    .card button.primary-btn { 
      width: 100%; 
      background: #3ecf8e; 
      color: #fff; 
      border: none; 
      padding: 10px; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      margin-bottom: 10px; 
    }
    .card button.primary-btn:hover { opacity: 0.9; }
    .card button.text-btn { 
      background: none; 
      border: none; 
      color: #0084ff; 
      font-size: 13px; 
      cursor: pointer; 
      text-decoration: underline; 
    }
    .error-msg { color: #ff4d4f; font-size: 12px; margin-bottom: 10px; min-height: 15px; }

    /* チャット画面 */
    .chat-card { 
      width: 100%; 
      max-width: 420px; 
      height: 600px; 
      background: #fff; 
      border-radius: 16px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
      display: none; 
      flex-direction: column; 
      overflow: hidden; 
      position: relative;
    }
    
    .chat-header { 
      background: #3ecf8e; 
      color: #fff; 
      padding: 12px 16px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      position: relative; 
    }
    .chat-header-title { font-weight: bold; font-size: 20px; letter-spacing: 0.5px; }
    
    /* 右上の四角いログアウトボタン */
    .logout-icon-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
    }
    .logout-icon-btn:hover { background: rgba(255, 255, 255, 0.3); }

    .chat-user-info { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 12px; margin-top: 8px; background: rgba(255,255,255,0.2); padding: 6px 10px; border-radius: 8px; }
    .chat-user-info button { background: none; border: 1px solid #fff; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 4px; }
    
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { background: #f0f2f5; padding: 10px 14px; border-radius: 12px; max-width: 80%; word-break: break-word; font-size: 14px; }
    .msg .author { font-size: 11px; font-weight: bold; color: #3ecf8e; margin-bottom: 2px; }
    
    .chat-input-area { padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; background: #fff; }
    .chat-input-area input { flex: 1; margin-bottom: 0; }
    .chat-input-area button { background: #3ecf8e; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* 横並びボタン用 */
    .button-group { display: flex; gap: 10px; margin-top: 16px; }
    .cancel-btn { background: #e0e0e0 !important; color: #333 !important; }
    .danger-btn { background: #ff4d4f !important; color: #fff !important; }
  </style>
</head>
<body>

  <!-- 1. アプリ全体の合言葉画面 -->
  <div class="modal-overlay" id="appPasswordModal">
    <div class="card">
      <h3>🔒 Roomie</h3>
      <p>アクセス合言葉を入力してください</p>
      <input type="password" id="appPassInput" placeholder="パスワードを入力" onkeypress="if(event.key==='Enter') checkAppPassword()">
      <div class="error-msg" id="appErrorMsg"></div>
      <button class="primary-btn" onclick="checkAppPassword()">入室する</button>
    </div>
  </div>

  <!-- 2. アカウント認証画面 -->
  <div class="modal-overlay" id="authModal" style="display: none;">
    <div class="card">
      <h3 id="authTitle">ログイン</h3>
      <p id="authSubTitle">アカウント名とパスワードを入力してください</p>
      <div class="error-msg" id="authErrorMsg"></div>
      <input type="text" id="usernameInput" placeholder="アカウント名">
      <input type="password" id="passwordInput" placeholder="パスワード (6文字以上)" onkeypress="if(event.key==='Enter') handleAuth()">
      <button class="primary-btn" id="authSubmitBtn" onclick="handleAuth()">ログインする</button>
      <button class="text-btn" id="authToggleBtn" onclick="toggleAuthMode()">アカウントを作成する</button>
    </div>
  </div>

  <!-- 🌟 ログアウト確認画面 -->
  <div class="modal-overlay" id="logoutConfirmModal" style="display: none;">
    <div class="card">
      <h3>ログアウト</h3>
      <p>本当にログアウトしますか？</p>
      <div class="button-group">
        <button class="primary-btn cancel-btn" onclick="closeLogoutConfirm()">いいえ</button>
        <button class="primary-btn danger-btn" onclick="executeLogout()">はい</button>
      </div>
    </div>
  </div>

  <!-- 3. チャット画面 -->
  <div class="chat-card" id="chatCard">
    <div class="chat-header">
      <!-- 🌟 右上の四角いログアウトボタン -->
      <button class="logout-icon-btn" onclick="showLogoutConfirm()" title="ログアウト">
        <!-- ドアから出るマークのアイコン（SVG） -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
      
      <div class="chat-header-title">Roomie</div>
      <div class="chat-user-info">
        <span>👤 <span id="currentUserName">読み込み中...</span></span>
        <div>
          <button onclick="changeDisplayName()">名前変更</button>
        </div>
      </div>
    </div>
    <div class="chat-messages" id="chatBox"></div>
    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">送信</button>
    </div>
  </div>

  <script>
    const APP_PASSWORD = 'jpcc';
    const SUPABASE_URL = 'https://tacauaubifbtrlbeeeaz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhY2F1YXViaWZidHJsYmVlZWF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MTc2NjUsImV4cCI6MjEwMjE5MzY2NX0.OZ7hgCEbsBPrgdK66Puy47_cJ6EAC9SIVsVvtDvqLCk';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUpMode = false;
    let currentUser = null;

    function nameToEmail(username) {
      const safeName = encodeURIComponent(username.trim().toLowerCase());
      return `${safeName}@roomie.app`;
    }

    function checkAppPassword() {
      const input = document.getElementById('appPassInput').value;
      if (input === APP_PASSWORD) {
        document.getElementById('appPasswordModal').style.display = 'none';
        document.getElementById('appErrorMsg').textContent = '';
        checkSession(); 
      } else {
        document.getElementById('appErrorMsg').textContent = '合言葉が違います';
      }
    }

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        showChatScreen();
      } else {
        document.getElementById('authModal').style.display = 'flex';
      }
    }

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('authErrorMsg').textContent = '';
      if (isSignUpMode) {
        document.getElementById('authTitle').textContent = 'アカウント作成';
        document.getElementById('authSubmitBtn').textContent = '作成してログイン';
        document.getElementById('authToggleBtn').textContent = '既存のアカウントでログイン';
      } else {
        document.getElementById('authTitle').textContent = 'ログイン';
        document.getElementById('authSubmitBtn').textContent = 'ログインする';
        document.getElementById('authToggleBtn').textContent = 'アカウントを作成する';
      }
    }

    async function handleAuth() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const errorMsg = document.getElementById('authErrorMsg');
      errorMsg.textContent = '';

      if (!username || !password) {
        errorMsg.textContent = 'アカウント名とパスワードを入力してください';
        return;
      }

      const email = nameToEmail(username);

      if (isSignUpMode) {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email, password: password, options: { data: { display_name: username } }
        });
        if (error) {
          errorMsg.textContent = '作成失敗: ' + (error.message.includes('already registered') ? 'そのアカウント名は既に使用されています' : error.message);
        } else {
          currentUser = data.user;
          document.getElementById('authModal').style.display = 'none';
          showChatScreen();
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email, password: password
        });
        if (error) {
          errorMsg.textContent = 'ログイン失敗: アカウント名かパスワードが違います';
        } else {
          currentUser = data.user;
          document.getElementById('authModal').style.display = 'none';
          showChatScreen();
        }
      }
    }

    // 🌟 ログアウト関連の処理
    function showLogoutConfirm() {
      document.getElementById('logoutConfirmModal').style.display = 'flex';
    }

    function closeLogoutConfirm() {
      document.getElementById('logoutConfirmModal').style.display = 'none';
    }

    async function executeLogout() {
      // 1. ログアウト処理を実行
      await supabaseClient.auth.signOut();
      currentUser = null;
      
      // 2. モーダルや画面をリセット
      closeLogoutConfirm();
      document.getElementById('chatCard').style.display = 'none';
      document.getElementById('authModal').style.display = 'none';
      
      // 3. 入力内容やチャット履歴を空にする
      document.getElementById('chatBox').innerHTML = '';
      document.getElementById('appPassInput').value = '';
      document.getElementById('usernameInput').value = '';
      document.getElementById('passwordInput').value = '';
      
      // 4. 一番最初の合言葉画面を表示する
      document.getElementById('appPasswordModal').style.display = 'flex';
    }

    async function changeDisplayName() {
      const currentName = currentUser.user_metadata.display_name || '名無し';
      const newName = prompt('新しいアカウント名を入力してください:', currentName);
      if (newName && newName.trim() !== '') {
        const { data, error } = await supabaseClient.auth.updateUser({
          data: { display_name: newName.trim() }
        });
        if (error) {
          alert('名前の更新に失敗しました: ' + error.message);
        } else {
          currentUser = data.user;
          updateHeaderName();
          alert('名前を変更しました！');
        }
      }
    }

    function updateHeaderName() {
      const name = currentUser.user_metadata.display_name || '名無し';
      document.getElementById('currentUserName').textContent = name;
    }

    function showChatScreen() {
      document.getElementById('chatCard').style.display = 'flex';
      updateHeaderName();
      fetchMessages();
      subscribeToNewMessages();
    }

    async function fetchMessages() {
      document.getElementById('chatBox').innerHTML = '';
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(50);
      if (data) data.forEach(msg => renderMessage(msg));
    }

    async function sendMessage() {
      const textInput = document.getElementById('messageInput');
      const text = textInput.value.trim();
      if (!text) return;

      textInput.value = '';

      const currentName = currentUser.user_metadata.display_name || '名無し';

      const { data, error } = await supabaseClient.from('messages').insert([{ 
        username: currentName, 
        text: text 
      }]).select();

      if (data && data.length > 0) {
        renderMessage(data[0]);
      }
    }

    function subscribeToNewMessages() {
      supabaseClient.removeAllChannels(); 
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    }

    function renderMessage(msg) {
      const chatBox = document.getElementById('chatBox');
      
      if (msg.id && document.getElementById('msg-' + msg.id)) {
        return;
      }

      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg';
      if (msg.id) {
        msgDiv.id = 'msg-' + msg.id;
      }
      
      msgDiv.innerHTML = `<div class="author">${escapeHtml(msg.username)}</div><div class="text">${escapeHtml(msg.text)}</div>`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
