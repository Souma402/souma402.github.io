<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomie - オンラインチャット</title>
  <!-- Supabase JS SDK の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-card { width: 100%; max-width: 420px; height: 600px; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #3ecf8e; color: #fff; padding: 16px; font-weight: bold; font-size: 20px; text-align: center; letter-spacing: 0.5px; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { background: #f0f2f5; padding: 10px 14px; border-radius: 12px; max-width: 80%; word-break: break-word; font-size: 14px; }
    .msg .author { font-size: 11px; font-weight: bold; color: #3ecf8e; margin-bottom: 2px; }
    .chat-input-area { padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; background: #fff; }
    input { border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; }
    #username { width: 90px; }
    #message { flex: 1; }
    button { background: #3ecf8e; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">Roomie</div>
    <div class="chat-messages" id="chatBox"></div>
    <div class="chat-input-area">
      <input type="text" id="username" placeholder="名前">
      <input type="text" id="message" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">送信</button>
    </div>
  </div>

  <script>
    // 1. Supabaseの初期設定（ご自身のものに置き換えてください）
    const SUPABASE_URL = 'https://tacauaubifbtrlbeeeaz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhY2F1YXViaWZidHJsYmVlZWF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MTc2NjUsImV4cCI6MjEwMjE5MzY2NX0.OZ7hgCEbsBPrgdK66Puy47_cJ6EAC9SIVsVvtDvqLCk';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 起動時に過去のメッセージを取得＆リアルタイム受信を開始
    window.onload = () => {
      fetchMessages();
      subscribeToNewMessages();
    };

    // 過去ログの読み込み (最新50件)
    async function fetchMessages() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(50);

      if (error) console.error('Error fetching:', error);
      else if (data) {
        data.forEach(msg => renderMessage(msg));
      }
    }

    // メッセージの送信
    async function sendMessage() {
      const nameInput = document.getElementById('username');
      const textInput = document.getElementById('message');
      
      const username = nameInput.value.trim() || '名無し';
      const text = textInput.value.trim();

      if (!text) return;

      textInput.value = '';

      const { error } = await supabaseClient
        .from('messages')
        .insert([{ username, text }]);

      if (error) console.error('Error sending:', error);
    }

    // リアルタイム変更の監視（新規追加をリスニング）
    function subscribeToNewMessages() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    }

    // 画面にメッセージを一枚追加する処理
    function renderMessage(msg) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg';
      
      msgDiv.innerHTML = `
        <div class="author">${escapeHtml(msg.username)}</div>
        <div class="text">${escapeHtml(msg.text)}</div>
      `;
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>

</body>
</html>
